---
- name: Legacy node like the current servers (Ubuntu archive build)
  hosts: legacy
  become: true
  tasks:
    - name: Install RabbitMQ 3.12.1 and Erlang 25 from the Ubuntu archive
      ansible.builtin.apt:
        name: rabbitmq-server
        update_cache: true

    - name: Start it
      ansible.builtin.systemd_service:
        name: rabbitmq-server
        state: started

    # Left by an older setup; must survive a refused run and be removed by the upgrade.
    - name: Legacy list-style source
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/rabbitmq.list
        content: |
          # deb [signed-by=/usr/share/keyrings/rabbitmq.gpg] https://deb1.rabbitmq.com/rabbitmq-server/ubuntu/noble noble main
        mode: "0644"
